<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ゆるるチャット - DM</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --bg1:#0b1220;
      --bg2:#0a1a2a;
      --line:rgba(255,255,255,.10);
      --text:#eaf2ff;
      --muted:rgba(234,242,255,.65);
      --accent:#6ee7ff;
      --accent2:#a78bfa;
      --card:rgba(255,255,255,.06);
      --good:#34d399;
      --warn:#fbbf24;
      --bad:#ff6b6b;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;
      color:var(--text);
      background:linear-gradient(180deg,var(--bg1),var(--bg2));
      min-height:100vh;
      display:flex;
      flex-direction:column;
    }
    .top{
      padding:14px;
      border-bottom:1px solid var(--line);
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      background:rgba(0,0,0,.18);
    }
    .wrap{
      max-width:860px;
      width:100%;
      margin:0 auto;
      padding:12px;
      display:flex;
      flex-direction:column;
      flex:1;
      gap:10px;
    }
    .btn{
      cursor:pointer;
      border-radius:14px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.08);
      color:var(--text);
      padding:10px 12px;
      font-weight:900;
    }
    .btnPrimary{
      border:none;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      color:#08131f;
    }
    .danger{
      border-color:rgba(255,107,107,.35);
      background:rgba(255,107,107,.12);
    }
    .hint{ font-size:12px; color:rgba(234,242,255,.55); }
    #status{ font-size:12px; color:var(--muted); padding:0 2px; }

    /* chat */
    .log{
      flex:1;
      border:1px solid var(--line);
      background:rgba(255,255,255,.04);
      border-radius:18px;
      padding:12px;
      overflow:auto;
    }
    .msg{ margin:8px 0; display:flex; }
    .me{ justify-content:flex-end; }
    .bubble{
      max-width:min(520px,86%);
      border:1px solid var(--line);
      background:rgba(255,255,255,.06);
      border-radius:16px;
      padding:10px 12px;
      line-height:1.5;
      white-space:pre-wrap;
      word-break:break-word;
    }
    .me .bubble{
      background:rgba(110,231,255,.10);
      border-color:rgba(110,231,255,.25);
    }
    .meta{ font-size:12px; color:var(--muted); margin-top:6px; }
    .msgImg{
      margin-top:8px;
      width:100%;
      max-width:520px;
      border-radius:16px;
      border:1px solid var(--line);
    }
    .expired{
      margin-top:8px;
      font-size:13px;
      color:rgba(234,242,255,.55);
      border:1px dashed rgba(255,255,255,.18);
      background:rgba(255,255,255,.04);
      padding:10px 12px;
      border-radius:14px;
    }

    .composer{
      display:flex;
      gap:10px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.04);
      border-radius:18px;
      padding:10px;
      align-items:flex-end;
      flex-wrap:wrap;
    }
    textarea{
      flex:1;
      padding:10px 12px;
      border-radius:14px;
      border:1px solid var(--line);
      background:rgba(0,0,0,.25);
      color:var(--text);
      resize:none;
      min-height:44px;
      max-height:120px;
      font-family:inherit;
    }

    /* call */
    .card{
      border:1px solid var(--line);
      background:rgba(255,255,255,.04);
      border-radius:18px;
      overflow:hidden;
    }
    .cardHeader{
      padding:12px 14px;
      border-bottom:1px solid rgba(255,255,255,.08);
      display:flex;
      align-items:center;
      justify-content:space-between;
      background:rgba(255,255,255,.03);
    }
    .chip{
      font-size:12px;
      padding:4px 10px;
      border-radius:999px;
      border:1px solid var(--line);
      color:var(--muted);
      background:rgba(255,255,255,.04);
    }
    .cardBody{ padding:12px 14px; }

    .callTop{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .rangeRow{
      margin-top:10px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(7,12,24,.30);
      border-radius:16px;
      padding:10px 12px;
    }
    .rangeRow .label{
      font-size:12px;
      color:var(--muted);
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:10px;
      gap:10px;
      flex-wrap:wrap;
    }
    input[type="range"]{ width:100%; accent-color:var(--accent); }
    .divider{ height:1px; background:rgba(255,255,255,.08); margin:12px 0; }

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
      align-items:start;
    }
    @media (max-width:720px){
      .grid{ grid-template-columns:1fr; }
    }
    .list{ display:flex; flex-direction:column; gap:8px; }
    .listItem{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.04);
      border-radius:14px;
      padding:8px 10px;
      font-size:13px;
    }
    .badge{
      padding:3px 8px;
      border-radius:999px;
      font-size:11px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.05);
      color:rgba(234,242,255,.80);
      font-weight:900;
    }
    .badge.good{ border-color:rgba(52,211,153,.35); background:rgba(52,211,153,.12); }
    .badge.warn{ border-color:rgba(251,191,36,.35); background:rgba(251,191,36,.12); }
    .badge.bad{ border-color:rgba(255,107,107,.35); background:rgba(255,107,107,.12); }

    .audios{ display:flex; flex-direction:column; gap:10px; }
    .audioWrap{
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.04);
      border-radius:14px;
      padding:10px;
    }
    .audioTitle{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      font-size:12px;
      color:var(--muted);
      margin-bottom:6px;
    }
    .audioCtl{
      display:flex;
      align-items:center;
      gap:10px;
      margin-top:8px;
    }
    .audioCtl .lbl{ min-width:90px; font-size:12px; color:var(--muted); }
    .audioCtl .val{ min-width:34px; text-align:right; font-size:12px; font-weight:900; }
  </style>
</head>

<body>
  <div class="top">
    <div style="font-weight:900;">💬 個人チャット</div>
    <div style="display:flex; gap:10px; align-items:center;">
      <button class="btn" onclick="goBack()">⬅ 戻る</button>
      <button class="btn" onclick="signOut()">🚪 ログアウト</button>
    </div>
  </div>

  <div class="wrap">
    <div id="status">読み込み中…</div>

    <!-- ✅ DM通話（ルームとは別チャンネル/別テーブル） -->
    <div class="card" id="callCard">
      <div class="cardHeader">
        <b>🎙️ 個人通話</b>
        <span class="chip">DM Call</span>
      </div>
      <div class="cardBody">
        <div class="callTop">
          <button class="btn btnPrimary" onclick="joinCall('talk')" id="joinBtn">🎤 話して参加</button>
          <button class="btn" onclick="joinCall('listen')" id="listenBtn">🎧 聞く専で参加</button>
          <button class="btn" onclick="toggleMute()" id="muteBtn">ミュート: OFF</button>
          <button class="btn danger" onclick="leaveCall()" id="leaveBtn">通話退出</button>
        </div>

        <div class="rangeRow">
          <div class="label">
            <span>自分のマイク音量: <b id="micGainLabel">100</b></span>
            <span class="hint">※ 送信音量（あなたの声の大きさ）</span>
          </div>
          <input id="micGain" type="range" min="1" max="100" value="100" />
          <div class="hint" style="margin-top:8px;" id="callState">未接続（必要なら通話に参加を押してね）</div>
        </div>

        <div class="divider"></div>

        <div class="grid">
          <div>
            <div class="hint" style="margin-bottom:8px;">参加者（通話：チャンネル接続中のみ表示）</div>
            <div class="list" id="callUsersList"><div class="hint">未接続</div></div>
          </div>

          <div>
            <div class="hint" style="margin-bottom:8px;">相手の音声</div>
            <div class="audios" id="audios"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- chat -->
    <div class="log" id="log"></div>

    <!-- ✅ テキスト送信 -->
    <div class="composer">
      <textarea id="text" placeholder="メッセージ…"></textarea>
      <button class="btn btnPrimary" onclick="sendText()">送信</button>
    </div>

    <!-- ✅ 画像送信（DM専用） -->
    <div class="composer" style="align-items:center;">
      <input id="imgFile" type="file" accept="image/*" />
      <span class="hint" id="imgName">未選択</span>
      <button class="btn btnPrimary" onclick="sendImage()" id="sendImgBtn">🖼️ 画像送信</button>
    </div>

    <div class="hint" id="uploadHint">※ 画像は Storage（public）にアップ→URLをDMに保存するよ（5MBまで）</div>
  </div>

<script>

  });

  function esc(s){
    return String(s||"")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }
  function setStatus(t){ const el=document.getElementById("status"); if(el) el.textContent=t; }
  function getRoomId(){
    const p = new URLSearchParams(location.search);
    return String(p.get("room_id") || "").trim();
  }
  function goBack(){ history.length>1 ? history.back() : location.replace("./lobby.html"); }
  async function signOut(){ try{ await sb.auth.signOut(); }catch{} location.replace("./login.html"); }
  function myUid(){ return authUser?.id || ""; }

  function normalizeAvatarUrl(url, ver){
    const u = String(url||"").trim();
    if(!u) return "";
    const v = String(ver||"").trim();
    if(!v) return u;
    return u + (u.includes("?") ? "&" : "?") + "v=" + encodeURIComponent(v);
  }
  function getPreferredAvatarMeta(){
    const um = authUser?.user_metadata || {};
    const hasCustom = !!String(um.custom_avatar_url || "").trim();
    const url = hasCustom ? String(um.custom_avatar_url||"").trim() : String(um.avatar_url||"").trim();
    const verRaw = hasCustom ? um.custom_avatar_ver : um.avatar_ver;
    const ver = String(verRaw ?? "").trim();
    return { url, ver };
  }
  function safeKey(s){
    return String(s||"").replace(/[^\w\-]+/g,"_").slice(0,80) || "dm";
  }

  async function requireLogin(){
    const { data: ses } = await sb.auth.getSession();
    if (!ses?.session){ location.replace("./login.html"); return false; }
    const { data: u } = await sb.auth.getUser();
    if (!u?.user){ location.replace("./login.html"); return false; }
    authUser = u.user;

    const dn = String(authUser?.user_metadata?.display_name || "").trim();
    const em = String(authUser?.email || "").trim();
    myName = dn || em || "名無しさん";
    const av = getPreferredAvatarMeta();
    myAvatarUrl = normalizeAvatarUrl(av.url, av.ver);

    return true;
